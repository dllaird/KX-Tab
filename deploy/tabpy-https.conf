[TabPy]
# Server config (HTTPS). Paths come from the environment (see deploy/kxtab.env.example):
# KXTAB_PWD_FILE, KXTAB_CERT_FILE, KXTAB_KEY_FILE. Tableau Cloud requires HTTPS with a
# certificate from a public CA, matching the hostname Tableau connects to.
TABPY_PORT = 9004
TABPY_EVALUATE_TIMEOUT = 120
TABPY_PWD_FILE = %(kxtab_pwd_file)s
TABPY_TRANSFER_PROTOCOL = https
TABPY_CERTIFICATE_FILE = %(kxtab_cert_file)s
TABPY_KEY_FILE = %(kxtab_key_file)s
TABPY_MINIMUM_TLS_VERSION = TLSv1_2
TABPY_LOG_DETAILS = true
