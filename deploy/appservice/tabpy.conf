[TabPy]
# Azure App Service config (HTTP). App Service terminates HTTPS on 443 and forwards to this port
# (app setting WEBSITES_PORT=8000). Paths are set by deploy/appservice/startup.sh.
TABPY_PORT = 8000
TABPY_EVALUATE_TIMEOUT = 120
TABPY_PWD_FILE = %(kxtab_pwd_file)s
TABPY_STATE_PATH = %(kxtab_state_dir)s
TABPY_QUERY_OBJECT_PATH = %(kxtab_state_dir)s/query_objects
TABPY_LOG_DETAILS = true
